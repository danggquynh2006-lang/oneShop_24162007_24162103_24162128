spring.application.name=OneShop
oneshop.seed-demo-users=false

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OneShop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=
jwt.expiration-hours=24

vnpay.tmn-code=
vnpay.hash-secret=
vnpay.return-url=http://localhost:8080/payment/vnpay/return
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.refund-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Tro ly tu van san pham Gemini (dat GEMINI_API_KEY trong bien moi truong)
oneshop.ai.gemini.api-key=${GEMINI_API_KEY:}
oneshop.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.properties.hibernate.use_nationalized_character_data=true
