<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-2">Đặt lại mật khẩu</h3>
                <p class="text-center text-muted">
                    Nếu email <strong th:text="${form.email}"></strong> đã đăng ký,
                    mã OTP gồm 6 số đã được gửi tới hộp thư của bạn.
                </p>
                <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:field="*{email}">
                    <div class="mb-3">
                        <label class="form-label">Mã OTP</label>
                        <input type="text" class="form-control text-center" th:field="*{code}"
                               maxlength="6" inputmode="numeric" placeholder="______"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Đặt lại mật khẩu</button>
                </form>

                <form th:action="@{/reset-password/resend}" method="post" class="text-center mt-3">
                    <input type="hidden" name="email" th:value="${form.email}">
                    <button type="submit" class="btn btn-link">Gửi lại mã</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
