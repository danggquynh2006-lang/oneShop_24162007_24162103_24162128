<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-2">Quên mật khẩu</h3>
                <p class="text-center text-muted">Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP để đặt lại mật khẩu.</p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" th:value="${email}" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Gửi mã OTP</button>
                </form>

                <p class="text-center mt-3 mb-0"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
