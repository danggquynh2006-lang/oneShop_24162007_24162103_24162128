<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Sản phẩm</title></head><body>
<h2 th:text="${product == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h2>
<div class="alert alert-success" th:if="${param.updated}">Đã lưu sản phẩm.</div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="${product == null} ? @{/vendor/products} : @{/vendor/products/{id}(id=${product.id})}" th:object="${form}" method="post" enctype="multipart/form-data" class="card card-body">
    <div class="row g-3"><div class="col-md-8"><label class="form-label">Tên sản phẩm</label><input class="form-control" th:field="*{name}" required><div class="text-danger" th:errors="*{name}"></div></div><div class="col-md-4"><label class="form-label">Thương hiệu</label><input class="form-control" th:field="*{brand}"></div>
    <div class="col-md-4"><label class="form-label">Danh mục</label><select class="form-select" th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select><div class="text-danger" th:errors="*{categoryId}"></div></div>
    <div class="col-md-4"><label class="form-label">Giá (VND)</label><input type="number" min="1" step="1" class="form-control" th:field="*{price}" required><div class="text-danger" th:errors="*{price}"></div></div>
    <div class="col-md-4"><label class="form-label">Tồn kho</label><input type="number" min="0" class="form-control" th:field="*{stock}" required><div class="text-danger" th:errors="*{stock}"></div></div>
	<div class="col-md-4"><label class="form-label">Giảm giá (%)</label><input type="number" min="0" max="90" step="1" class="form-control" th:field="*{discountPercent}" required><div class="text-danger" th:errors="*{discountPercent}"></div></div>
    <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" th:field="*{description}" rows="5"></textarea></div>
    <div class="col-12"><label class="form-label">Ảnh sản phẩm</label><input class="form-control" type="file" name="images" accept="image/*" multiple></div>
    <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Hiển thị</label></div>
    <div class="col-12"><button class="btn btn-danger">Lưu</button><a href="/vendor/products" class="btn btn-outline-secondary ms-2">Quay lại</a></div></div>
</form>
<div th:if="${product != null}" class="d-flex gap-3 mt-4"><div th:each="image : ${images}"><img th:src="${image.url}" style="width:120px;height:120px;object-fit:cover" alt="Ảnh sản phẩm"><form th:action="@{/vendor/products/{id}/images/{imageId}/delete(id=${product.id},imageId=${image.id})}" method="post"><button class="btn btn-sm btn-outline-danger mt-1">Xóa ảnh</button></form></div></div>
</body></html>
