<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Chi tiết đơn hàng</title></head><body>
<a href="/vendor/orders">← Danh sách đơn</a><h2 class="mt-3">Đơn hàng #<span th:text="${order.id}"></span></h2>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="card card-body mb-3"><p>Trạng thái: <strong th:text="${order.status.label}"></strong></p><p>Khách hàng: <span th:text="${order.user.fullName}"></span></p><p>Địa chỉ: <span th:text="${order.addressSnapshot}"></span></p><p>Thanh toán: <span th:text="${order.paymentMethod}"></span></p></div>
<table class="table bg-white"><thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th></tr></thead><tbody><tr th:each="item : ${items}"><td th:text="${item.productName}"></td><td th:text="${item.quantity}"></td><td th:text="${#numbers.formatDecimal(item.unitPrice,0,'POINT',0,'COMMA')} + ' đ'"></td></tr></tbody></table>
<p class="text-end fs-5">Tổng: <strong class="text-danger" th:text="${#numbers.formatDecimal(order.total,0,'POINT',0,'COMMA')} + ' đ'"></strong></p>
<div class="mb-3" th:if="${order.status.name() != 'NEW' and order.status.name() != 'CANCELLED'}"><a class="btn btn-outline-secondary" th:href="@{/vendor/orders/{id}/slip(id=${order.id})}" target="_blank"><i class="bi bi-printer"></i> In phiếu giao</a></div>
<div class="d-flex gap-2" th:if="${order.status.name() == 'NEW'}"><form th:action="@{/vendor/orders/{id}/confirm(id=${order.id})}" method="post"><button class="btn btn-success">Xác nhận</button></form><form th:action="@{/vendor/orders/{id}/reject(id=${order.id})}" method="post"><button class="btn btn-outline-danger">Từ chối</button></form></div>
<div class="card card-body mb-3" th:if="${returnRequest != null}">
    <h5>Yêu cầu trả hàng của khách</h5>
    <p class="mb-1">Lý do: <strong th:text="${returnRequest.reason}"></strong></p>
    <p class="mb-1" th:if="${returnRequest.note != null}" style="white-space: pre-line"
       th:text="${returnRequest.note}"></p>
    <p class="mb-1 text-muted small"
       th:text="'Gửi lúc ' + ${#temporals.format(returnRequest.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
    <p class="mb-1">Trạng thái:
        <span class="badge bg-warning text-dark" th:if="${returnRequest.effectiveStatus.name() == 'PENDING'}">Chờ xử lý</span>
        <span class="badge bg-success" th:if="${returnRequest.effectiveStatus.name() == 'APPROVED'}">Đã chấp nhận</span>
        <span class="badge bg-danger" th:if="${returnRequest.effectiveStatus.name() == 'REJECTED'}">Đã từ chối</span>
    </p>
    <p class="mb-0 text-danger"
       th:if="${returnRequest.effectiveStatus.name() == 'REJECTED' and returnRequest.responseNote != null}"
       th:text="'Lý do từ chối: ' + ${returnRequest.responseNote}"></p>
</div>
<div class="row g-2" th:if="${order.status.name() == 'RETURN_REQUESTED'}">
    <div class="col-md-4">
        <form th:action="@{/vendor/orders/{id}/return(id=${order.id})}" method="post">
            <input type="hidden" name="accept" value="true">
            <button class="btn btn-danger w-100">Duyệt trả hàng</button>
        </form>
    </div>
    <div class="col-md-8">
        <form th:action="@{/vendor/orders/{id}/return(id=${order.id})}" method="post">
            <input type="hidden" name="accept" value="false">
            <textarea name="note" class="form-control mb-2" rows="2" required minlength="5" maxlength="500"
                      placeholder="Lý do từ chối (bắt buộc, gửi cho khách)"></textarea>
            <button class="btn btn-outline-secondary">Từ chối yêu cầu</button>
        </form>
    </div>
<div th:if="${payment != null and payment.status.name() == 'REFUND_PENDING'}" class="alert alert-warning mt-3">Khoản hoàn tiền đang chờ gửi đến VNPAY hoặc xử lý thủ công cho COD.
    <form th:if="${payment.method.name() == 'VNPAY'}" th:action="@{/vendor/orders/{id}/refund(id=${order.id})}" method="post" class="mt-2"><button class="btn btn-warning">Gửi yêu cầu hoàn tiền VNPAY</button></form>
    <form th:if="${payment.method.name() == 'COD'}" th:action="@{/vendor/orders/{id}/cash-refund(id=${order.id})}" method="post" class="mt-2"><button class="btn btn-warning">Xác nhận đã hoàn tiền mặt</button></form>
</div>
</body></html>
