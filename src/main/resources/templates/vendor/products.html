<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Sản phẩm của shop</title></head>
<body>
<main class="container-fluid py-2">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h2 class="mb-1">Sản phẩm của shop</h2>
            <p class="text-muted mb-0">Quản lý giá, tồn kho, hình ảnh và trạng thái hiển thị.</p>
        </div>
        <a class="btn btn-danger" th:href="@{/vendor/products/new}"><i class="bi bi-plus-lg"></i> Thêm sản phẩm</a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="get" th:action="@{/vendor/products}" class="input-group mb-3">
        <input class="form-control" name="query" th:value="${query}" placeholder="Tìm theo tên sản phẩm">
        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Tìm</button>
    </form>

    <div class="table-responsive">
        <table class="table table-hover table-striped align-middle bg-white">
            <thead><tr><th>Tên</th><th>Danh mục</th><th>Giá bán</th><th>Tồn kho</th><th>Đã bán</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="product : ${products.content}">
                <td><a class="fw-semibold text-decoration-none" th:href="@{/vendor/products/{id}/edit(id=${product.id})}" th:text="${product.name}"></a><br><small class="text-muted" th:text="${product.brand}"></small></td>
                <td th:text="${product.category.name}"></td>
                <td><span th:replace="~{fragments/price :: price(${product})}"></span></td>
                <td th:text="${product.stock}"></td>
                <td th:text="${product.sold}"></td>
                <td><span class="badge" th:classappend="${product.active} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${product.active} ? 'Đang bán' : 'Đang ẩn'"></span></td>
                <td><div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/vendor/products/{id}/edit(id=${product.id})}">Sửa</a>
                    <form th:action="@{/vendor/products/{id}/toggle(id=${product.id})}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${product.active} ? 'Ẩn' : 'Hiện'"></button></form>
                    <form th:action="@{/vendor/products/{id}/delete(id=${product.id})}" method="post" onsubmit="return confirm('Xóa sản phẩm?')"><button class="btn btn-sm btn-outline-danger" th:disabled="${product.sold > 0}">Xóa</button></form>
                </div></td>
            </tr>
            <tr th:if="${products.empty}"><td colspan="7" class="text-center text-muted py-4">Shop chưa có sản phẩm.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${products.totalPages > 1}" aria-label="Phân trang sản phẩm">
        <a th:each="page : ${#numbers.sequence(0,products.totalPages - 1)}" th:href="@{/vendor/products(page=${page},query=${query})}" th:text="${page + 1}" class="btn btn-sm btn-outline-secondary me-1"></a>
    </nav>
</main>
</body>
</html>
