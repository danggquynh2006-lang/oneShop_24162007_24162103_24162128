<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Sản phẩm của shop</title></head><body>
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Sản phẩm của shop</h2><a class="btn btn-danger" href="/vendor/products/new">Thêm sản phẩm</a></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="get" class="input-group mb-3"><input class="form-control" name="query" th:value="${query}" placeholder="Tìm theo tên"><button class="btn btn-outline-secondary">Tìm</button></form>
<div class="table-responsive"><table class="table table-hover bg-white"><thead><tr><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Tồn</th><th>Đã bán</th><th>Trạng thái</th><th></th></tr></thead>
<tbody><tr th:each="product : ${products.content}"><td th:text="${product.name}"></td><td th:text="${product.category.name}"></td><td th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' đ'"></td><td th:text="${product.stock}"></td><td th:text="${product.sold}"></td><td th:text="${product.isLocked()} ? 'Bị quản trị khóa' : (${product.active} ? 'Đang bán' : 'Đã ẩn')"></td>
<td class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/vendor/products/{id}/edit(id=${product.id})}">Sửa</a><form th:unless="${product.isLocked()}" th:action="@{/vendor/products/{id}/toggle(id=${product.id})}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${product.active ? 'Ẩn' : 'Hiện'}"></button></form><form th:action="@{/vendor/products/{id}/delete(id=${product.id})}" method="post" onsubmit="return confirm('Xóa sản phẩm?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table></div>
<p th:if="${products.empty}">Chưa có sản phẩm.</p>
<nav th:if="${products.totalPages > 1}"><a th:each="page : ${#numbers.sequence(0,products.totalPages - 1)}" th:href="@{/vendor/products(page=${page},query=${query})}" th:text="${page + 1}" class="btn btn-sm btn-outline-secondary me-1"></a></nav>
</body></html>
