<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đơn được giao</title>
</head>
<body>
<h3 class="mb-3">Đơn được phân công</h3>

<div class="d-flex flex-wrap gap-2 mb-3">
    <a class="btn btn-sm" th:href="@{/shipper/orders}"
       th:classappend="${selected == null} ? 'btn-danger' : 'btn-outline-secondary'">Tất cả</a>
    <a class="btn btn-sm" th:each="s : ${tabs}" th:href="@{/shipper/orders(status=${s})}"
       th:classappend="${s == selected} ? 'btn-danger' : 'btn-outline-secondary'"
       th:text="${s.name() == 'CANCELLED'} ? 'Giao thất bại' : ${s.label}"></a>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
        <tr>
            <th>Mã đơn</th>
            <th>Cửa hàng</th>
            <th>Khách nhận</th>
            <th>Địa chỉ giao</th>
            <th>Thanh toán</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${orders.empty}">
            <td colspan="8" class="text-center text-muted py-4">Chưa có đơn nào.</td>
        </tr>
        <tr th:each="order : ${orders.content}">
            <td th:text="'#' + ${order.id}"></td>
            <td th:text="${order.shop.name}"></td>
            <td th:text="${order.user.fullName}"></td>
            <td th:text="${order.addressSnapshot}"></td>
            <td th:text="${order.paymentMethod}"></td>
            <td th:text="${#numbers.formatDecimal(order.total,0,'POINT',0,'COMMA')} + ' đ'"></td>
            <td>
                <span class="badge bg-secondary"
                      th:text="${order.status.name() == 'CANCELLED'} ? 'Giao thất bại' : ${order.status.label}"></span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/shipper/orders/{id}(id=${order.id})}">Chi tiết</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${orders.totalPages > 1}">
    <ul class="pagination">
        <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
            <a class="page-link" th:href="@{/shipper/orders(status=${selected},page=${orders.number - 1})}">Trước</a>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(0, orders.totalPages - 1)}"
            th:classappend="${p == orders.number} ? 'active'">
            <a class="page-link" th:text="${p + 1}"
               th:href="@{/shipper/orders(status=${selected},page=${p})}"></a>
        </li>
        <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
            <a class="page-link" th:href="@{/shipper/orders(status=${selected},page=${orders.number + 1})}">Sau</a>
        </li>
    </ul>
</nav>
</body>
</html>
