<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết đơn giao</title>
</head>
<body>
<a th:href="@{/shipper/orders}">← Danh sách đơn</a>
<h3 class="mt-3">Đơn hàng #<span th:text="${order.id}"></span></h3>

<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<div class="card card-body mb-3">
    <p class="mb-1">Trạng thái:
        <strong th:text="${order.status.name() == 'CANCELLED'} ? 'Giao thất bại' : ${order.status.label}"></strong>
    </p>
    <p class="mb-1">Lấy hàng tại: <strong th:text="${order.shop.name}"></strong>
        <span th:if="${order.shop.address}" th:text="' - ' + ${order.shop.address}"></span></p>
    <p class="mb-1">Khách nhận: <span th:text="${order.user.fullName}"></span>
        <span th:if="${order.user.phone}" th:text="' - SĐT ' + ${order.user.phone}"></span></p>
    <p class="mb-1">Địa chỉ giao: <span th:text="${order.addressSnapshot}"></span></p>
    <p class="mb-0">Thanh toán: <span th:text="${order.paymentMethod}"></span>
        <span class="badge bg-warning text-dark ms-2" th:if="${order.paymentMethod.name() == 'COD'}"
              th:text="'Thu hộ ' + ${#numbers.formatDecimal(order.total,0,'POINT',0,'COMMA')} + ' đ'"></span>
        <span class="badge bg-success ms-2" th:if="${order.paymentMethod.name() != 'COD'}">Đã thanh toán online, không thu tiền</span>
    </p>
</div>

<table class="table bg-white">
    <thead class="table-light">
    <tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th></tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item.productName}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${#numbers.formatDecimal(item.unitPrice,0,'POINT',0,'COMMA')} + ' đ'"></td>
    </tr>
    </tbody>
</table>
<p class="text-end fs-5">Tổng đơn:
    <strong class="text-danger" th:text="${#numbers.formatDecimal(order.total,0,'POINT',0,'COMMA')} + ' đ'"></strong>
</p>

<div class="d-flex gap-2">
    <form th:if="${order.status.name() == 'CONFIRMED'}"
          th:action="@{/shipper/orders/{id}/pickup(id=${order.id})}" method="post">
        <button type="submit" class="btn btn-danger"><i class="bi bi-box-seam"></i> Đã lấy hàng</button>
    </form>

    <form th:if="${order.status.name() == 'PICKED_UP'}"
          th:action="@{/shipper/orders/{id}/start(id=${order.id})}" method="post">
        <button type="submit" class="btn btn-danger"><i class="bi bi-truck"></i> Bắt đầu giao</button>
    </form>

    <th:block th:if="${order.status.name() == 'SHIPPING'}">
        <form th:action="@{/shipper/orders/{id}/delivered(id=${order.id})}" method="post"
              onsubmit="return confirm('Xác nhận đã giao hàng thành công?')">
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Đã giao thành công</button>
        </form>
        <form th:action="@{/shipper/orders/{id}/failed(id=${order.id})}" method="post"
              onsubmit="return confirm('Báo giao thất bại? Đơn sẽ bị hủy và hoàn lại tồn kho.')">
            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-x-circle"></i> Giao thất bại</button>
        </form>
    </th:block>
</div>
</body>
</html>
