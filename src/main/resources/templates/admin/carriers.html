<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý nhà vận chuyển</title>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Quản lý nhà vận chuyển</h3>
    <a th:href="@{/admin/carriers/new}" class="btn btn-danger"><i class="bi bi-plus-lg"></i> Thêm nhà vận chuyển</a>
</div>

<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<form th:action="@{/admin/carriers}" method="get" class="row g-2 mb-3">
    <div class="col-md-10">
        <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên nhà vận chuyển"
               th:value="${keyword}">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-danger w-100"><i class="bi bi-search"></i> Tìm</button>
    </div>
</form>

<p class="text-muted">Có <strong th:text="${carriers.totalElements}"></strong> nhà vận chuyển.</p>

<div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tên nhà vận chuyển</th>
            <th class="text-end">Phí vận chuyển</th>
            <th>Trạng thái</th>
            <th class="text-end">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${carriers.empty}">
            <td colspan="5" class="text-center text-muted py-4">Không có nhà vận chuyển nào.</td>
        </tr>
        <tr th:each="c : ${carriers.content}">
            <td th:text="${c.id}"></td>
            <td><i class="bi bi-truck text-secondary"></i> <span th:text="${c.name}"></span></td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(c.shippingFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
            <td>
                <span class="badge bg-success" th:if="${c.active}">Hoạt động</span>
                <span class="badge bg-secondary" th:unless="${c.active}">Tạm dừng</span>
            </td>
            <td class="text-end">
                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/admin/carriers/{id}/edit(id=${c.id})}"
                       class="btn btn-sm btn-outline-secondary">Sửa</a>

                    <form th:action="@{/admin/carriers/{id}/toggle(id=${c.id})}" method="post">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="page" th:value="${carriers.number}">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:text="${c.active} ? 'Tạm dừng' : 'Kích hoạt'"></button>
                    </form>

                    <form th:action="@{/admin/carriers/{id}/delete(id=${c.id})}" method="post"
                          onsubmit="return confirm('Xóa nhà vận chuyển này?')">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="page" th:value="${carriers.number}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${carriers.totalPages > 1}">
    <ul class="pagination">
        <li class="page-item" th:classappend="${carriers.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/carriers(keyword=${keyword},page=${carriers.number - 1})}">Trước</a>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(0, carriers.totalPages - 1)}"
            th:classappend="${p == carriers.number} ? 'active'">
            <a class="page-link" th:text="${p + 1}"
               th:href="@{/admin/carriers(keyword=${keyword},page=${p})}"></a>
        </li>
        <li class="page-item" th:classappend="${carriers.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/carriers(keyword=${keyword},page=${carriers.number + 1})}">Sau</a>
        </li>
    </ul>
</nav>
</body>
</html>
