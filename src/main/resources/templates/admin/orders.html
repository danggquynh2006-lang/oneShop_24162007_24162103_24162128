<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý đơn hàng</title>
</head>
<body>
<h3 class="mb-3">Quản lý đơn hàng</h3>

<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<form th:action="@{/admin/orders}" method="get" class="row g-2 mb-3">
    <div class="col-md-10">
        <select name="status" class="form-select">
            <option value="">Tất cả trạng thái</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == status}"
                    th:text="${s.label}"></option>
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-danger w-100"><i class="bi bi-funnel"></i> Lọc</button>
    </div>
</form>

<p class="text-muted">Có <strong th:text="${orders.totalElements}"></strong> đơn.
    Chỉ phân công được shipper cho đơn <strong>Đã xác nhận</strong>.</p>

<div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
        <tr>
            <th>Mã đơn</th>
            <th>Shop</th>
            <th>Khách</th>
            <th>Địa chỉ giao</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Shipper</th>
            <th style="width:280px">Phân công</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${orders.empty}">
            <td colspan="8" class="text-center text-muted py-4">Không có đơn nào.</td>
        </tr>
        <tr th:each="order : ${orders.content}">
            <td th:text="'#' + ${order.id}"></td>
            <td th:text="${order.shop.name}"></td>
            <td th:text="${order.user.fullName}"></td>
            <td th:text="${order.addressSnapshot}"></td>
            <td th:text="${#numbers.formatDecimal(order.total,0,'POINT',0,'COMMA')} + ' đ'"></td>
            <td><span class="badge bg-secondary" th:text="${order.status.label}"></span></td>
            <td th:text="${order.shipper != null} ? ${order.shipper.email} : '—'"></td>
            <td>
                <form th:if="${order.status.name() == 'CONFIRMED'}"
                      th:action="@{/admin/orders/{id}/assign(id=${order.id})}" method="post" class="d-flex gap-1">
                    <input type="hidden" name="status" th:value="${status}">
                    <input type="hidden" name="page" th:value="${orders.number}">
                    <select name="shipperId" class="form-select form-select-sm" required>
                        <option value="">-- Chọn shipper --</option>
                        <option th:each="s : ${shippers}" th:value="${s.id}" th:text="${s.email}"
                                th:selected="${order.shipper != null and order.shipper.id == s.id}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            th:text="${order.shipper == null} ? 'Phân công' : 'Đổi'"></button>
                </form>
                <span th:unless="${order.status.name() == 'CONFIRMED'}" class="text-muted">—</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${orders.totalPages > 1}">
    <ul class="pagination">
        <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/orders(status=${status},page=${orders.number - 1})}">Trước</a>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(0, orders.totalPages - 1)}"
            th:classappend="${p == orders.number} ? 'active'">
            <a class="page-link" th:text="${p + 1}" th:href="@{/admin/orders(status=${status},page=${p})}"></a>
        </li>
        <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/orders(status=${status},page=${orders.number + 1})}">Sau</a>
        </li>
    </ul>
</nav>
</body>
</html>
