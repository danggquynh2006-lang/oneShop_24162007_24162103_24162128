<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/oneshop.css}"/>
</head>
<body>
<div class="container py-4">
    <h2 class="mb-3">Đơn hàng</h2>

    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>
    <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}"></div>

    <!-- Filter -->
    <form method="get" th:action="@{/admin/orders}" class="row g-2 mb-3 align-items-end">
        <div class="col-auto">
            <label class="form-label">Trạng thái</label>
            <select name="status" class="form-select">
                <option value="">Tất cả</option>
                <option th:each="st : ${T(com.oneshop.common.OrderStatus).values()}"
                        th:value="${st.name()}"
                        th:text="${st.label}"
                        th:selected="${status != null and status.name() == st.name()}"></option>
            </select>
        </div>
        <div class="col-auto form-check mt-4">
            <input type="checkbox" name="unassigned" value="true" class="form-check-input" id="unassigned"
                   th:checked="${unassigned}"/>
            <label class="form-check-label" for="unassigned">Chưa phân công</label>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Lọc</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Shop</th>
                <th>Khách</th>
                <th>Tổng</th>
                <th>Trạng thái</th>
                <th>Shipper</th>
                <th>Ngày tạo</th>
                <th th:if="${canAssign}">Phân công</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.shop != null ? o.shop.name : '-'}"></td>
                <td th:text="${o.user != null ? o.user.email : '-'}"></td>
                <td th:text="${#numbers.formatDecimal(o.total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${o.status.label}"></span>
                </td>
                <td th:text="${o.shipper != null ? o.shipper.email : 'Chưa có'}"></td>
                <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:if="${canAssign}">
                    <form th:if="${o.status.name() == 'READY_TO_SHIP' and o.shipper == null}"
                          th:action="@{/admin/orders/{id}/assign(id=${o.id})}" method="post" class="d-flex gap-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <select name="shipperId" class="form-select form-select-sm" required>
                            <option value="">Chọn shipper</option>
                            <option th:each="s : ${shippers}" th:value="${s.id}"
                                    th:text="${s.email + ' (đang giữ ' + (workload != null and workload[s.id] != null ? workload[s.id] : 0) + ' đơn)'}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-success">Giao</button>
                    </form>
                    <span th:if="${o.shipper != null}" class="text-muted small">Đã phân công</span>
                    <span th:if="${o.status.name() != 'READY_TO_SHIP' and o.shipper == null}" class="text-muted small">Chờ sẵn sàng</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="8" class="text-center text-muted">Không có đơn hàng</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Phân trang đơn giản -->
    <nav th:if="${totalPages != null and totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${page - 1}, status=${status}, unassigned=${unassigned})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == page} ? 'active'">
                <a class="page-link" th:href="@{/admin/orders(page=${i}, status=${status}, unassigned=${unassigned})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${page >= totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${page + 1}, status=${status}, unassigned=${unassigned})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
