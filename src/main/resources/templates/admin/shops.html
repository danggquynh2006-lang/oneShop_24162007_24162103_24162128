<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Quản lý shop</title></head><body>
<div class="container py-4">
  <h2>Quản lý shop</h2>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <nav class="nav nav-pills my-3">
    <a class="nav-link" th:each="state : ${T(com.oneshop.common.ShopStatus).values()}"
       th:classappend="${state == currentStatus} ? 'active'"
       th:href="@{/admin/shops(status=${state})}" th:text="${state}"></a>
  </nav>
  <div class="table-responsive"><table class="table table-striped align-middle">
    <thead><tr><th>Shop</th><th>Chủ shop</th><th>Địa chỉ</th><th>Ngày tạo</th><th>Chiết khấu</th><th></th></tr></thead>
    <tbody><tr th:each="shop : ${shops.content}">
      <td><strong th:text="${shop.name}"></strong><div class="small text-muted" th:text="${shop.description}"></div></td>
      <td th:text="${shop.owner.email}"></td><td th:text="${shop.address}"></td>
      <td th:text="${#temporals.format(shop.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
      <td><form class="d-flex gap-2" th:action="@{/admin/shops/{id}/commission(id=${shop.id})}" method="post">
        <input type="hidden" name="status" th:value="${currentStatus}">
        <input class="form-control form-control-sm" style="width:100px" type="number" name="commissionRate"
               min="0" max="100" step="0.01" required th:value="${shop.commissionRate}">
        <button class="btn btn-sm btn-outline-primary">Lưu %</button>
      </form></td>
      <td><form th:if="${shop.status.name() == 'PENDING'}" th:action="@{/admin/shops/{id}/approve(id=${shop.id})}" method="post">
        <button class="btn btn-sm btn-success">Duyệt</button>
      </form></td>
    </tr></tbody>
  </table></div>
  <p th:if="${shops.empty}">Không có shop ở trạng thái này.</p>
</div></body></html>
