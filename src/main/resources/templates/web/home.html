<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>OneShop - Trang chủ</title>
</head>
<body>
    <div class="container my-4">
    <div class="mb-4">
	    <h5 class="mb-3">Danh mục</h5>
	    <div class="d-flex flex-wrap gap-2">
	        <div class="dropdown" th:each="c : ${categories}">
	            <a class="btn btn-outline-danger dropdown-toggle"
	               th:if="${!c.children.isEmpty()}"
	               href="#" role="button" data-bs-toggle="dropdown" th:text="${c.name}"></a>
	            <ul class="dropdown-menu" th:if="${!c.children.isEmpty()}">
	                <li><a class="dropdown-item fw-bold"
	                       th:href="@{/category/{id}(id=${c.id})}" th:text="'Tất cả ' + ${c.name}"></a></li>
	                <li th:each="s : ${c.children}">
	                    <a class="dropdown-item" th:href="@{/category/{id}(id=${s.id})}" th:text="${s.name}"></a>
	                </li>
	            </ul>
	            <a class="btn btn-outline-danger" th:if="${c.children.isEmpty()}"
	               th:href="@{/category/{id}(id=${c.id})}" th:text="${c.name}"></a>
	        </div>
	    </div>
	</div>
        <h3 class="mb-4">Sản phẩm bán chạy</h3>
        <div class="row">
            <div class="col-6 col-md-3 mb-4" th:each="product : ${products}">
                <div class="card h-100">
                    <div class="card-body">
                        <h6 class="card-title">
						    <a th:href="@{/product/{id}(id=${product.id})}" class="stretched-link text-decoration-none"
						       th:text="${product.name}"></a>
						</h6>
                        <div class="text-danger fw-bold" th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' đ'"></div>
                        <small class="text-muted" th:text="${product.brand}"></small>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${products.empty}">Chưa có sản phẩm.</p>
    </div>
</body>
</html>
