<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${shop.name} + ' - OneShop'">Shop - OneShop</title></head>
<body>
<main class="container py-4">
    <img th:if="${shop.banner != null and !shop.banner.isBlank()}" th:src="${shop.banner}" class="w-100 rounded mb-4" style="max-height:300px;object-fit:cover" alt="Banner shop">
    <div class="d-flex align-items-center gap-3 mb-4">
        <img th:if="${shop.logo != null and !shop.logo.isBlank()}" th:src="${shop.logo}" style="width:72px;height:72px;object-fit:cover" class="rounded-circle" alt="Logo shop">
        <div><h2 th:text="${shop.name}"></h2><p class="text-muted mb-0" th:text="${shop.description}"></p></div>
    </div>
    <h4>Sản phẩm nổi bật</h4>
    <p th:if="${products.empty}" class="text-muted">Shop chưa có sản phẩm đang bán.</p>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="product : ${products.content}">
            <article class="card h-100">
                <a th:href="@{/product/{id}(id=${product.id})}" class="d-flex justify-content-center align-items-center p-2" style="height:210px">
                    <img th:if="${imageUrls[product.id] != null}" th:src="${imageUrls[product.id]}" th:alt="${product.name}" style="max-width:100%;max-height:100%;object-fit:contain" loading="lazy" referrerpolicy="no-referrer">
                    <div th:if="${imageUrls[product.id] == null}" class="bg-light text-muted d-flex align-items-center justify-content-center w-100 h-100">Chưa có ảnh</div>
                </a>
                <div class="card-body">
                    <h5 class="h6"><a class="text-decoration-none" th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}"></a></h5>
                    <div><span th:replace="~{fragments/price :: price(${product})}"></span></div>
                </div>
            </article>
        </div>
    </div>
    <nav th:if="${products.totalPages > 1}" class="d-flex gap-2 mt-3" aria-label="Phân trang sản phẩm shop">
        <a th:each="page : ${#numbers.sequence(0,products.totalPages - 1)}" th:href="@{/shops/{id}(id=${shop.id},page=${page})}" th:text="${page + 1}" class="btn btn-sm btn-outline-secondary"></a>
    </nav>
</main>
</body>
</html>
