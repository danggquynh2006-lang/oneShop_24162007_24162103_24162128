<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title th:text="${shop.name}">Shop</title></head><body>
<main class="container py-4">
    <img th:if="${shop.banner}" th:src="${shop.banner}" class="w-100 rounded mb-4" style="max-height:300px;object-fit:cover" alt="Banner shop">
    <div class="d-flex align-items-center gap-3 mb-4"><img th:if="${shop.logo}" th:src="${shop.logo}" style="width:72px;height:72px;object-fit:cover" alt="Logo shop"><div><h2 th:text="${shop.name}"></h2><p class="text-muted mb-0" th:text="${shop.description}"></p></div></div>
    <h4>Sản phẩm nổi bật</h4>
    <div class="row g-3"><div class="col-md-3" th:each="product : ${products.content}"><div class="card h-100"><img th:if="${imageUrls[product.id] != null}" th:src="${imageUrls[product.id]}" th:alt="${product.name}" class="card-img-top p-2" style="height:210px;object-fit:contain" loading="lazy" referrerpolicy="no-referrer"><div class="card-body"><h5 th:text="${product.name}"></h5><p th:text="${product.brand}"></p><strong class="text-danger" th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' đ'"></strong><p><a th:href="@{/product/{id}(id=${product.id})}">Xem sản phẩm</a></p></div></div></div></div>
    <p th:if="${products.empty}">Shop chưa có sản phẩm.</p>
</main></body></html>
