<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title th:text="${shop.name}">Shop</title></head><body>
<main class="container py-4">
    <img th:if="${shop.banner}" th:src="${shop.banner}" class="w-100 rounded mb-4" style="max-height:300px;object-fit:cover" alt="Banner shop">
    <div class="d-flex align-items-center gap-3 mb-4"><img th:if="${shop.logo}" th:src="${shop.logo}" style="width:72px;height:72px;object-fit:cover" alt="Logo shop"><div><h2 th:text="${shop.name}"></h2><p class="text-muted mb-0" th:text="${shop.description}"></p></div></div>
    <h4>Sản phẩm nổi bật</h4>
    <span th:replace="~{fragments/price :: price(${product})}"></span>
    <p th:if="${products.empty}">Shop chưa có sản phẩm.</p>
</main></body></html>
