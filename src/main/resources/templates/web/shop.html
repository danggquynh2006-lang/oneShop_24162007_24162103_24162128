<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${shop != null ? shop.name : 'Shop'}">Shop</title>
    <link rel="stylesheet" th:href="@{/css/oneshop.css}"/>
</head>
<body>
<div class="container py-4">

    <!-- Thông tin shop -->
    <div class="card mb-4" th:if="${shop != null}">
        <div class="row g-0">
            <div class="col-md-3 text-center p-3">
                <img th:if="${shop.logo != null and !#strings.isEmpty(shop.logo)}"
                     th:src="${shop.logo}" alt="Logo" class="img-fluid rounded" style="max-height:120px"/>
                <div th:if="${shop.logo == null or #strings.isEmpty(shop.logo)}"
                     class="bg-light rounded d-flex align-items-center justify-content-center" style="height:120px">
                    <span class="text-muted">No logo</span>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card-body">
                    <h3 class="card-title" th:text="${shop.name}">Tên shop</h3>
                    <p class="card-text text-muted" th:text="${shop.description}">Mô tả</p>
                    <p class="mb-0"><strong>Địa chỉ:</strong> <span th:text="${shop.address}">-</span></p>
                </div>
            </div>
        </div>
        <img th:if="${shop.banner != null and !#strings.isEmpty(shop.banner)}"
             th:src="${shop.banner}" class="card-img-bottom" alt="Banner" style="max-height:200px; object-fit:cover"/>
    </div>

    <h4 class="mb-3">Sản phẩm của shop</h4>

    <div class="row row-cols-2 row-cols-md-4 g-3">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 product-card">
                <a th:href="@{/products/{id}(id=${product.id})}" class="text-decoration-none text-dark">
                    <!-- Ảnh sản phẩm – null-safe -->
                    <img th:if="${imageUrls != null and imageUrls[product.id] != null}"
                         th:src="${imageUrls[product.id]}"
                         class="card-img-top"
                         th:alt="${product.name}"
                         style="height:180px; object-fit:cover"/>

                    <div th:if="${imageUrls == null or imageUrls[product.id] == null}"
                         class="bg-light d-flex align-items-center justify-content-center"
                         style="height:180px">
                        <span class="text-muted small">Không có ảnh</span>
                    </div>

                    <div class="card-body">
                        <h6 class="card-title text-truncate" th:text="${product.name}">Tên SP</h6>
                        <p class="card-text text-danger fw-bold mb-1"
                           th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</p>
                        <small class="text-muted"
                               th:text="'Đã bán: ' + ${product.sold != null ? product.sold : 0}"></small>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center text-muted py-5">
        Shop chưa có sản phẩm nào.
    </div>

    <!-- Phân trang nếu có -->
    <nav th:if="${totalPages != null and totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${currentPage - 1})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${currentPage + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
