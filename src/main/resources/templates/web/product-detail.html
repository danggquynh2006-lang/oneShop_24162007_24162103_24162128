<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name} + ' - OneShop'">Chi tiết sản phẩm - OneShop</title>
</head>
<body>
    <div class="container my-4">
        <a th:href="@{/shops/{id}(id=${product.shop.id})}">← Về cửa hàng</a>
        <div class="row">
            <div class="col-md-5 mb-4">
                <img th:if="${imageUrl != null}" th:src="${imageUrl}" th:alt="${product.name}"
                     class="img-fluid border rounded w-100" style="max-height:480px;object-fit:contain" referrerpolicy="no-referrer">
                <div th:if="${imageUrl == null}" class="border rounded p-5 text-center text-muted">Shop chưa thêm ảnh sản phẩm</div>
            </div>
            <div class="col-md-7">
                <h3 th:text="${product.name}"></h3>
                <p class="text-muted" th:text="${product.brand}"></p>
				<div class="my-2"><span class="text-danger fs-3 fw-bold" th:text="${#numbers.formatDecimal(product.finalPrice,0,'POINT',0,'COMMA')} + ' đ'"></span>
				    <span th:if="${product.discountPercent > 0}"><del class="text-muted ms-2" th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' đ'"></del> <span class="badge bg-danger ms-1" th:text="'-' + ${product.discountPercent} + '%'"></span></span></div>
                <p class="text-muted" th:text="'Đã bán ' + ${product.sold} + ' · Còn ' + ${product.stock} + ' sản phẩm'"></p>
                <p th:text="${product.description}"></p>
                <p>Shop: <a th:href="@{/shops/{id}(id=${product.shop.id})}" th:text="${product.shop.name}"></a></p>
            </div>
        </div>

        <section class="mt-5">
            <h4>Đánh giá sản phẩm <span class="text-warning">★</span>
                <span class="small text-muted" th:text="${#numbers.formatDecimal(product.avgRating,1,1)}"></span>
            </h4>
            <div class="alert alert-success" th:if="${reviewMessage}" th:text="${reviewMessage}"></div>
            <div class="alert alert-danger" th:if="${reviewError}" th:text="${reviewError}"></div>
            <form th:if="${canReview}" th:action="@{/product/{id}/reviews(id=${product.id})}" th:object="${reviewForm}" method="post" class="card card-body mb-3">
                <label class="form-label" for="rating">Số sao</label>
                <select class="form-select mb-2" id="rating" th:field="*{rating}" required>
                    <option value="">Chọn số sao</option><option value="5">5 sao</option><option value="4">4 sao</option>
                    <option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option>
                </select>
                <label class="form-label" for="comment">Nhận xét</label>
                <textarea class="form-control mb-2" id="comment" th:field="*{comment}" maxlength="2000" rows="3"></textarea>
                <button class="btn btn-danger align-self-start">Gửi đánh giá</button>
            </form>
            <p th:if="${#lists.isEmpty(reviews)}" class="text-muted">Chưa có đánh giá.</p>
            <article class="border rounded p-3 mb-2" th:each="review : ${reviews}">
                <strong th:text="${review.user.fullName ?: review.user.email}"></strong>
                <span class="text-warning" th:text="${'★'.repeat(review.rating)}"></span>
                <p class="mb-1" th:text="${review.comment}"></p>
                <small class="text-muted" th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')}"></small>
            </article>
        </section>

    </div>
</body>
</html>
