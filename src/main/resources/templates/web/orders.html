<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đơn mua của tôi - OneShop</title>
</head>
<body>
    <div class="container my-4">
        <h3 class="mb-3">Đơn mua của tôi</h3>

        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <ul class="nav nav-tabs mb-3">
            <li class="nav-item" th:each="t : ${tabs}">
                <a class="nav-link" th:classappend="${t == current} ? 'active'"
                   th:href="@{/user/orders(tab=${t.name()})}" th:text="${t.label}"></a>
            </li>
        </ul>

        <div class="alert alert-info" th:if="${orders.isEmpty()}">Chưa có đơn hàng nào trong mục này.</div>

        <div class="card mb-3" th:each="o : ${orders}">
            <div class="card-header d-flex justify-content-between">
                <span th:text="${o.shopName}"></span>
                <span class="text-danger" th:text="${current.label}"></span>
            </div>
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div>Đơn hàng #<span th:text="${o.id}"></span></div>
                    <small class="text-muted" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
                <div>
                    Tổng tiền:
                    <span class="text-danger fw-bold"
                          th:text="${#numbers.formatInteger(o.total, 0, 'POINT')} + ' đ'"></span>
                </div>
            </div>
            <div class="card-footer text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/user/orders/{id}(id=${o.id})}">Xem chi tiết</a>
                <form class="d-inline" method="post" th:action="@{/user/orders/{id}/cancel(id=${o.id})}"
                      th:if="${current.name() == 'NEW'}"
                      onsubmit="return confirm('Bạn chắc chắn muốn hủy đơn này?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Hủy đơn</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
