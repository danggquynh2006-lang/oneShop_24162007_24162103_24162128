<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${category.name} + ' - OneShop'">Danh mục - OneShop</title>
</head>
<body>
    <div class="container my-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item" th:if="${category.parentId != null}">
                    <a th:href="@{/category/{id}(id=${category.parentId})}" th:text="${category.parentName}"></a>
                </li>
                <li class="breadcrumb-item active" th:text="${category.name}"></li>
            </ol>
        </nav>

        <h3 class="mb-3" th:text="${category.name}"></h3>

        <div class="d-flex flex-wrap gap-2 mb-3" th:if="${!category.children.isEmpty()}">
            <a class="btn btn-sm btn-outline-danger" th:each="s : ${category.children}"
               th:href="@{/category/{id}(id=${s.id})}" th:text="${s.name}"></a>
        </div>

        <form method="get" th:action="@{/category/{id}(id=${category.id})}"
              class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">Có <strong th:text="${products.totalElements}"></strong> sản phẩm</span>
            <select name="sort" class="form-select w-auto" onchange="this.form.submit()">
                <option value="sold" th:selected="${sort == 'sold'}">Bán chạy nhất</option>
                <option value="new" th:selected="${sort == 'new'}">Mới nhất</option>
                <option value="rating" th:selected="${sort == 'rating'}">Đánh giá cao</option>
                <option value="price_asc" th:selected="${sort == 'price_asc'}">Giá tăng dần</option>
                <option value="price_desc" th:selected="${sort == 'price_desc'}">Giá giảm dần</option>
            </select>
        </form>

        <div th:if="${products.empty}" class="alert alert-info">Chưa có sản phẩm nào trong danh mục này.</div>

        <div class="row">
            <div class="col-6 col-md-3 mb-4" th:each="p : ${products.content}">
                <div class="card h-100">
                    <div class="card-body">
                        <h6 class="card-title">
                            <a th:href="@{/product/{id}(id=${p.id})}" class="stretched-link text-decoration-none"
                               th:text="${p.name}"></a>
                        </h6>
                        <div class="text-danger fw-bold"
                             th:text="${#numbers.formatInteger(p.price, 0, 'POINT')} + ' đ'"></div>
                        <small class="text-muted" th:text="'Đã bán ' + ${p.sold}"></small>
                    </div>
                </div>
            </div>
        </div>

        <nav th:if="${products.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/category/{id}(id=${category.id}, page=${products.number - 1}, sort=${sort})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                    th:classappend="${i == products.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/category/{id}(id=${category.id}, page=${i}, sort=${sort})}"
                       th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/category/{id}(id=${category.id}, page=${products.number + 1}, sort=${sort})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
