<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="menu(active)" class="list-group mb-3">
    <a th:href="@{/user/profile}" class="list-group-item list-group-item-action"
       th:classappend="${active == 'profile'} ? 'active'">
        <i class="bi bi-person"></i> Tài khoản của tôi
    </a>
    <a th:href="@{/user/addresses}" class="list-group-item list-group-item-action"
       th:classappend="${active == 'addresses'} ? 'active'">
        <i class="bi bi-geo-alt"></i> Địa chỉ nhận hàng
    </a>
    <a th:href="@{/user/orders}" class="list-group-item list-group-item-action"
       th:classappend="${active == 'orders'} ? 'active'">
        <i class="bi bi-receipt"></i> Đơn hàng của tôi
    </a>
    <a th:href="@{/user/favorites}" class="list-group-item list-group-item-action"
       th:classappend="${active == 'favorites'} ? 'active'">
        <i class="bi bi-heart"></i> Yêu thích
    </a>
    <a th:href="@{/user/viewed}" class="list-group-item list-group-item-action"
       th:classappend="${active == 'viewed'} ? 'active'">
        <i class="bi bi-clock-history"></i> Đã xem
    </a>
    <a th:href="@{/shop/register}" class="list-group-item list-group-item-action">
        <i class="bi bi-shop"></i> Đăng ký bán hàng (mở shop)
    </a>
</div>
</body>
</html>
