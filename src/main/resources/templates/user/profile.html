<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tài khoản của tôi</title>
</head>
<body>
<div class="row">
    <div class="col-md-3" th:replace="~{fragments/user-menu :: menu('profile')}"></div>

    <div class="col-md-9">
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h4 class="mb-3">Thông tin cá nhân</h4>
                <div class="alert alert-danger" th:if="${profileError}" th:text="${profileError}"></div>

                <form th:action="@{/user/profile}" th:object="${profileForm}" method="post"
                      enctype="multipart/form-data" novalidate>
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img th:if="${user.avatar}" th:src="${user.avatar}" alt="Avatar"
                             class="rounded-circle border" style="width:80px;height:80px;object-fit:cover">
                        <i th:unless="${user.avatar}" class="bi bi-person-circle text-secondary" style="font-size:80px"></i>
                        <div>
                            <label class="form-label mb-1">Ảnh đại diện</label>
                            <input type="file" name="avatarFile" class="form-control"
                                   accept="image/jpeg,image/png,image/webp">
                            <div class="form-text">JPG, PNG hoặc WEBP, tối đa 2MB.</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" th:value="${user.email}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" class="form-control" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <button type="submit" class="btn btn-danger">Lưu thay đổi</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-3">Đổi mật khẩu</h4>
                <div class="alert alert-danger" th:if="${passwordError}" th:text="${passwordError}"></div>

                <form th:action="@{/user/profile/password}" th:object="${passwordForm}" method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" th:field="*{currentPassword}"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{newPassword}"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn btn-outline-danger">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
