<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Địa chỉ nhận hàng</title>
</head>
<body>
<div class="row">
    <div class="col-md-3" th:replace="~{fragments/user-menu :: menu('addresses')}"></div>

    <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Địa chỉ nhận hàng</h4>
            <a th:href="@{/user/addresses/new}" class="btn btn-danger"><i class="bi bi-plus-lg"></i> Thêm địa chỉ</a>
        </div>
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

        <div class="alert alert-info" th:if="${#lists.isEmpty(addresses)}">
            Bạn chưa có địa chỉ nào. Hãy thêm địa chỉ để đặt hàng nhanh hơn.
        </div>

        <div class="card shadow-sm mb-3" th:each="a : ${addresses}">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <strong th:text="${a.receiverName}"></strong>
                        <span class="text-muted"> | <span th:text="${a.phone}"></span></span>
                        <span class="badge bg-danger ms-2" th:if="${a.defaultAddress}">Mặc định</span>
                        <div class="mt-1" th:text="${a.detail}"></div>
						<div class="text-muted" th:text="${a.ward + ', ' + a.province}"></div>
                    </div>
                    <div class="d-flex flex-column align-items-end gap-1">
                        <div>
                            <a th:href="@{/user/addresses/{id}/edit(id=${a.id})}"
                               class="btn btn-sm btn-outline-secondary">Sửa</a>
                            <form th:action="@{/user/addresses/{id}/delete(id=${a.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('Xóa địa chỉ này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </div>
                        <form th:action="@{/user/addresses/{id}/default(id=${a.id})}" method="post"
                              th:unless="${a.defaultAddress}">
                            <button type="submit" class="btn btn-sm btn-link p-0">Đặt làm mặc định</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
